name: Keep Supabase alive

# Supabase free-tier projects auto-pause after ~7 days with no API requests.
# This hits the project's REST endpoint every 3 days to reset that idle timer.
# Uses the same publishable key already committed in config.js (safe by design:
# RLS blocks anon access to all tables, see config.js comment).

on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable__aIhoXThzHqkJp3NLgWVaQ_-5VArfDp" \
            "https://emfzvpiminajqvgunreb.supabase.co/rest/v1/")
          echo "Supabase REST endpoint responded with HTTP $code"
          # Any response (even 401/404) means the project is awake and reachable.
          if [ "$code" = "000" ]; then
            echo "No response at all — project may be paused or deleted."
            exit 1
          fi
