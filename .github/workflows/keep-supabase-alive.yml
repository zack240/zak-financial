name: Keep Supabase alive

# Supabase free-tier projects auto-pause when idle. A read of the REST root was
# NOT enough (project paused 2026-11-23 even though this ping succeeded 22 Nov).
# This now calls the keepalive_touch() RPC, which does a real DB WRITE (heartbeat
# row), twice a day, independent of any PC being switched on.
# Uses the publishable key already committed in config.js (anon can only execute
# keepalive_touch; the heartbeat table has RLS on and no grants).
# Fails (GitHub emails the repo owner) if the write doesn't return 2xx, which
# usually means the project is paused: resume it in the Supabase dashboard, or
# let the office PC's local script auto-restore it.

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Heartbeat write (keepalive_touch)
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST               -H "apikey: sb_publishable__aIhoXThzHqkJp3NLgWVaQ_-5VArfDp"               -H "Authorization: Bearer sb_publishable__aIhoXThzHqkJp3NLgWVaQ_-5VArfDp"               -H "Content-Type: application/json" -d '{}'               "https://emfzvpiminajqvgunreb.supabase.co/rest/v1/rpc/keepalive_touch")
            echo "Attempt $i: HTTP $code $(head -c 200 /tmp/out)"
            case "$code" in 2*) exit 0;; esac
            sleep 30
          done
          echo "::error::keepalive_touch failed, project may be paused"
          exit 1
